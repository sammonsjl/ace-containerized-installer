---
# ── Identity ────────────────────────────────────────────────────────────────
ace_hostname: ace
# The inventories set this per host; the default is the SSH address. It must
# be an IP: it goes into the certificate's IP SAN.
ace_ip: "{{ ansible_host }}"

# Base directory for all component config on the target
ace_dir: "{{ ansible_user_dir }}/ace"

# ── Images ──────────────────────────────────────────────────────────────────
# Every platform component is built by ace-images and published to GHCR as a
# multi-arch manifest (linux/amd64 + linux/arm64). Nothing rides a moving
# upstream tag.
#
# ace_image_tag pins the whole set at once. ace-images' build-all publishes
# :latest and one tag per run, :YYYYMMDD-r<run> (single-image CI builds use
# :YYYYMMDD-<sha>); pin the dated tag so a re-run months apart installs the
# same platform, and bumping is this one line.
ace_image_tag: 20260928-r1
ace_registry: ghcr.io/sammonsjl

gateway_image: "{{ ace_registry }}/ace-gateway:{{ ace_image_tag }}"
controller_image: "{{ ace_registry }}/ace-controller:{{ ace_image_tag }}"
hub_image: "{{ ace_registry }}/ace-hub:{{ ace_image_tag }}"
eda_image: "{{ ace_registry }}/ace-eda:{{ ace_image_tag }}"
receptor_image: "{{ ace_registry }}/ace-receptor:{{ ace_image_tag }}"
ee_image: "{{ ace_registry }}/ace-ee-minimal:{{ ace_image_tag }}"
de_image: "{{ ace_registry }}/ace-de-supported:{{ ace_image_tag }}"

# Not ours, and deliberately so. Each is a stock public image, none is the
# lesson, and each is configured entirely by files this collection mounts.
envoy_image: docker.io/envoyproxy/envoy:v1.33.5
postgresql_image: docker.io/library/postgres:15
redis_image: docker.io/library/redis:7
trust_image: quay.io/rockylinux/rockylinux:9   # EL9 userspace for one-shot update-ca-trust

# hub-web and eda-web are pure nginx muxes in front of their component's
# sockets — no application, every byte served from a mounted nginx.conf and a
# shared volume. The console in the gateway image is the real front door for
# both, so stock nginx is all either container needs.
hub_web_image: docker.io/library/nginx:stable
eda_web_image: docker.io/library/nginx:stable

# ── Ports (single host, network:host — separation is by port number) ────────
envoy_https_port: 443
envoy_http_port: 80
gateway_nginx_port: 8446          # gateway nginx (ssl), behind envoy
gateway_uwsgi_port: 8052          # 127.0.0.1 only
gateway_grpc_port: 50051          # envoy auth/control-plane gRPC
controller_nginx_port: 8443       # controller nginx (ssl)
controller_nginx_http_port: 8080
controller_uwsgi_port: 8050       # 127.0.0.1 only
controller_daphne_port: 8051      # 127.0.0.1 only
eda_gunicorn_port: 8010           # 127.0.0.1 only
eda_daphne_port: 8011             # 127.0.0.1 only
eda_nginx_port: 8445              # eda web (ssl), behind envoy
hub_api_port: 24817               # pulpcore-api, 127.0.0.1 only
hub_content_port: 24816           # pulpcore-content, 127.0.0.1 only
hub_nginx_port: 8444              # hub web (ssl), behind envoy
postgresql_port: 5432
redis_tcp_port: 6379

# ── Credentials ──────────────────────────────────────────────────────────────
# Lab defaults — override with -e or vault for anything beyond a lab.
# Generated values persist in .secrets/ (gitignored) so re-runs are idempotent.
admin_user: admin
admin_email: admin@example.com
admin_password: "{{ lookup('password', secrets_dir ~ '/admin_password length=24 chars=ascii_letters,digits') }}"
postgresql_admin_user: postgres
postgresql_admin_password: "{{ lookup('password', secrets_dir ~ '/pg_admin_password length=24 chars=ascii_letters,digits') }}"
gateway_pg_password: "{{ lookup('password', secrets_dir ~ '/gateway_pg_password length=24 chars=ascii_letters,digits') }}"
controller_pg_password: "{{ lookup('password', secrets_dir ~ '/controller_pg_password length=24 chars=ascii_letters,digits') }}"
eda_pg_password: "{{ lookup('password', secrets_dir ~ '/eda_pg_password length=24 chars=ascii_letters,digits') }}"
eda_secret_key: "{{ lookup('password', secrets_dir ~ '/eda_secret_key length=64 chars=ascii_letters,digits') }}"
hub_pg_password: "{{ lookup('password', secrets_dir ~ '/hub_pg_password length=24 chars=ascii_letters,digits') }}"
hub_secret_key: "{{ lookup('password', secrets_dir ~ '/hub_secret_key length=64 chars=ascii_letters,digits') }}"
# Fernet key (urlsafe-b64 of 32 bytes) for pulp's field encryption; the
# persisted password provides the stable 32 input bytes
hub_database_fields_key: "{{ lookup('password', secrets_dir ~ '/hub_fernet_seed length=32 chars=ascii_letters,digits') | b64encode | replace('+', '-') | replace('/', '_') }}"
redis_password: "{{ lookup('password', secrets_dir ~ '/redis_password length=24 chars=ascii_letters,digits') }}"
gateway_secret_key: "{{ lookup('password', secrets_dir ~ '/gateway_secret_key length=64 chars=ascii_letters,digits') }}"
controller_secret_key: "{{ lookup('password', secrets_dir ~ '/controller_secret_key length=64 chars=ascii_letters,digits') }}"
secrets_dir: "{{ (playbook_dir ~ '/../.secrets') | realpath }}"

# ── Shared container environment ─────────────────────────────────────────────
# OPENSSL_armcap=0: some virtualized aarch64 guests (seen under VMware Fusion
# on Apple Silicon) SIGILL (exit 132) in anything importing python-cryptography
# without it. Harmless on x86_64; on real arm64 it only disables asm
# acceleration.
common_env:
  OPENSSL_armcap: "0"

# ── URLs ─────────────────────────────────────────────────────────────────────
# The IP, not the hostname: the guest's own hostname is not guaranteed to
# resolve anywhere else, and jewel's URL validator wants something resolvable.
gateway_main_url: "https://{{ ace_ip }}"
ca_trust_bundle: /etc/pki/tls/certs/ca-bundle.crt
