---
# postgres.py and channels.py carry credentials, so they live as podman
# secrets (mounted into /etc/tower/conf.d/), not files on disk — same as
# the bundle. controller_resource_server was created by gateway postinstall.
- name: Create controller podman secrets
  containers.podman.podman_secret:
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    skip_existing: true
  loop:
    - name: controller_secret_key
      data: '{{ controller_secret_key }}'
    - name: controller_postgres
      data: "{{ lookup('ansible.builtin.template', 'postgres.py.j2') }}"
    - name: controller_channels
      data: "{{ lookup('ansible.builtin.template', 'channels.py.j2') }}"
  loop_control:
    label: '{{ item.name }}'
  no_log: true

- name: Assert the resource-server secret exists
  containers.podman.podman_secret_info:
    name: controller_resource_server
  register: _rs
  failed_when: _rs.secrets | length == 0
