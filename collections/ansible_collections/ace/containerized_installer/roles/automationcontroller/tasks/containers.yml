---
- name: Create the automation-controller-rsyslog container
  containers.podman.podman_container:
    name: automation-controller-rsyslog
    image: '{{ controller_image }}'
    state: created
    command: /usr/bin/launch_awx_rsyslog.sh
    network: host
    user: '{{ ansible_user_uid }}:0'
    userns: keep-id
    env: >-
      {{ _controller_env | combine({
        'SUPERVISOR_CONFIG_PATH': '/etc/supervisord_rsyslog.conf',
      }) }}
    secrets: '{{ _controller_secrets }}'
    volume: '{{ _controller_common_volumes + [_licensing_volume] + _controller_service_volumes }}'
    generate_systemd:
      container_prefix: ''
      separator: ''
      path: '{{ ansible_user_dir }}/.config/systemd/user'
      restart_policy: on-failure
  notify: Restart automation-controller-rsyslog

# label=disable + host podman binary/socket: the task container dispatches
# jobs to receptor, and receptor/EEs run through the host's rootless podman.
- name: Create the automation-controller-task container
  containers.podman.podman_container:
    name: automation-controller-task
    image: '{{ controller_image }}'
    state: created
    command: /usr/bin/launch_awx_task.sh
    network: host
    user: '{{ ansible_user_uid }}:0'
    userns: keep-id
    security_opt:
      - label=disable
    env: >-
      {{ _controller_env | combine({
        'SUPERVISOR_CONFIG_PATH': '/etc/supervisord_task.conf',
        'CONTAINER_HOST': 'unix://run/user/' ~ ansible_user_uid ~ '/podman/podman.sock',
      }) }}
    secrets: '{{ _controller_secrets }}'
    volume: '{{ _controller_common_volumes + [_licensing_volume] + _controller_service_volumes + _controller_task_volumes }}'
    generate_systemd:
      container_prefix: ''
      separator: ''
      path: '{{ ansible_user_dir }}/.config/systemd/user'
      restart_policy: on-failure
  notify: Restart automation-controller-task

- name: Create the automation-controller-web container
  containers.podman.podman_container:
    name: automation-controller-web
    image: '{{ controller_image }}'
    state: created
    command: /usr/bin/launch_awx_web.sh
    network: host
    user: '{{ ansible_user_uid }}:0'
    userns: keep-id
    stop_timeout: 30
    env: >-
      {{ _controller_env | combine({
        'SUPERVISOR_CONFIG_PATH': '/etc/supervisord_web.conf',
      }) }}
    secrets: '{{ _controller_secrets }}'
    volume: '{{ _controller_common_volumes + [_licensing_volume] + _controller_service_volumes + _controller_web_volumes }}'
    generate_systemd:
      container_prefix: ''
      separator: ''
      path: '{{ ansible_user_dir }}/.config/systemd/user'
      restart_policy: on-failure
  notify: Restart automation-controller-web
