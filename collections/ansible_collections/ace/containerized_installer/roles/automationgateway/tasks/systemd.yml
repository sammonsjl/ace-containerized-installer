---
- name: Enable and start the automation-gateway unit
  ansible.builtin.systemd:
    name: automation-gateway
    scope: user
    daemon_reload: true
    enabled: true
    state: started

- name: Wait for the gateway API to answer
  ansible.builtin.uri:
    url: 'https://127.0.0.1:{{ gateway_nginx_port }}/api/gateway/v1/ping/'
    validate_certs: false
    status_code: 200
  register: _gateway_ping
  until: _gateway_ping.status == 200
  retries: 30
  delay: 10

# Envoy opens no ports yet: its listeners are LDS-programmed by the gateway
# only after postinstall registers the http_port objects.
- name: Enable and start the automation-gateway-proxy unit
  ansible.builtin.systemd:
    name: automation-gateway-proxy
    scope: user
    daemon_reload: true
    enabled: true
    state: started
