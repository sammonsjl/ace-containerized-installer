---
# Service registration over the gateway REST API. The RH installer drives the
# same API through its ansible.platform modules; those aren't published
# upstream, so we speak REST directly with GET-then-POST idempotency.
#
# validate_certs is off for these loopback calls: ansible's urls.py cannot
# build a verified SSL context on EL9 at all (ASN1 NOT_ENOUGH_DATA against any
# https host — its trust loader chokes on EL9's TRUSTED CERTIFICATE bundles).
# The wire is still TLS; curl/python on the host verify fine via system trust.

- name: Wait for the gateway API
  ansible.builtin.uri:
    url: '{{ _gateway_api }}/ping/'
    validate_certs: false
    status_code: 200
  register: _ping
  until: _ping.status == 200
  retries: 30
  delay: 10

- name: Set the gateway proxy URL setting
  ansible.builtin.uri:
    url: '{{ _gateway_api }}/settings/all/'
    validate_certs: false
    method: PUT
    user: '{{ admin_user }}'
    password: '{{ admin_password }}'
    force_basic_auth: true
    body_format: json
    body:
      gateway_proxy_url: '{{ gateway_main_url }}'
    status_code: [200, 202]
  changed_when: true

- name: Look up the API http port
  ansible.builtin.uri:
    url: '{{ _gateway_api }}/http_ports/?name=port-{{ envoy_https_port }}'
    validate_certs: false
    user: '{{ admin_user }}'
    password: '{{ admin_password }}'
    force_basic_auth: true
  register: _http_port_q

- name: Create the API http port
  ansible.builtin.uri:
    url: '{{ _gateway_api }}/http_ports/'
    validate_certs: false
    method: POST
    user: '{{ admin_user }}'
    password: '{{ admin_password }}'
    force_basic_auth: true
    body_format: json
    body:
      name: 'port-{{ envoy_https_port }}'
      number: '{{ envoy_https_port | int }}'
      use_https: true
      is_api_port: true
    status_code: 201
  when: _http_port_q.json.count == 0
  register: _http_port_c

- name: Remember the http port id
  ansible.builtin.set_fact:
    _http_port_id: >-
      {{ (_http_port_q.json.count > 0)
         | ternary(_http_port_q.json.results[0].id | default(0), _http_port_c.json.id | default(0)) }}

# The gateway itself registers first (order 0) so envoy routes /api/gateway/
# and the UI to its nginx; then the controller.
- name: Register services
  ansible.builtin.include_tasks: register_service.yml
  # path semantics: envoy matches the service's public gateway_path and
  # rewrites it to service_path. The gateway serves UI + API from / — so its
  # service_path is /, a pure pass-through. The controller serves
  # /api/controller/ natively (OPTIONAL_API_URLPATTERN_PREFIX).
  # Envoy routes are first-match in `order`: the / catch-all MUST come last.
  loop:
    - { name: controller, path: /api/controller/, port: '{{ controller_nginx_port }}', order: 1 }
    - { name: eda, path: /api/eda/, port: '{{ eda_nginx_port }}', order: 3 }
    - { name: gateway, path: /, port: '{{ gateway_nginx_port }}', order: 100 }
  loop_control:
    loop_var: _svc
    label: '{{ _svc.name }}'

# With port-{{ envoy_https_port }} registered, the gateway's next LDS response
# programs the public listener into envoy (polling every 5s).
- name: Wait for envoy to expose the public port
  ansible.builtin.wait_for:
    port: '{{ envoy_https_port }}'
    host: 127.0.0.1
    timeout: 120

- name: Verify the gateway answers through envoy
  ansible.builtin.uri:
    url: 'https://127.0.0.1:{{ envoy_https_port }}/api/gateway/v1/ping/'
    validate_certs: false
    status_code: 200
  register: _envoy_ping
  until: _envoy_ping.status == 200
  retries: 24
  delay: 5

# Resource-server keys let each service trust gateway-issued JWTs.
- name: Generate service secrets
  ansible.builtin.include_tasks: service_key.yml
  loop:
    - controller
    - eda
  loop_control:
    loop_var: _component
