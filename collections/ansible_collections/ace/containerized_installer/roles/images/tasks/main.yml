---
# Every image is a fully-qualified reference to a published multi-arch manifest,
# so acquisition is one pull. The GHCR-first-then-retag dance this replaced
# existed only because gateway and hub were the sole images we built; now that
# all of them are, there is nothing left to retag.

- name: Pull every image the platform runs
  containers.podman.podman_image:
    name: '{{ item }}'
  loop: '{{ _ace_images }}'
  register: _pulled
  # An offline or rate-limited registry should not fail the play outright when
  # a local tarball can still satisfy it; the assert below is what actually
  # decides, once we know which images are missing.
  failed_when: false

- name: Note which images the pull could not satisfy
  ansible.builtin.set_fact:
    _missing: >-
      {{ _pulled.results | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='item') | list }}

- name: Load missing images from delivered tarballs
  when: _missing | length > 0 and ace_images_tar_dir is defined
  block:
    - name: Check for a tarball per missing image
      ansible.builtin.stat:
        path: '{{ ace_images_tar_dir }}/{{ item | regex_replace(".*/", "") | regex_replace(":.*", "") }}.tar'
      register: _tars
      loop: '{{ _missing }}'

    - name: Load them
      containers.podman.podman_load:
        input: '{{ item.stat.path }}'
      when: item.stat.exists
      loop: '{{ _tars.results }}'
      loop_control:
        label: '{{ item.stat.path }}'

    - name: Record what the tarballs covered
      ansible.builtin.set_fact:
        _missing: >-
          {{ _tars.results | rejectattr('stat.exists') | map(attribute='item') | list }}

- name: Fail with the images that could not be acquired
  ansible.builtin.assert:
    that: _missing | length == 0
    fail_msg: >-
      Could not acquire: {{ _missing | join(', ') }}.
      Fix connectivity or authentication to the registry, or set
      ace_images_tar_dir to a directory holding <image-name>.tar for each.
