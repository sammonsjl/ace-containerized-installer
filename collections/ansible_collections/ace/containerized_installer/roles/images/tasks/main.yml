---
- name: Check whether locally-built images are already loaded
  containers.podman.podman_image_info:
    name: '{{ item.image }}'
  register: _local_image_info
  loop:
    - { image: '{{ gateway_image }}', tar: '{{ gateway_image_tar }}' }
    - { image: '{{ hub_image }}', tar: '{{ hub_image_tar }}' }
  loop_control:
    label: '{{ item.image }}'

- name: Load locally-built images from delivered tarballs
  containers.podman.podman_load:
    input: '{{ item.item.tar }}'
  when: item.images | length == 0
  loop: '{{ _local_image_info.results }}'
  loop_control:
    label: '{{ item.item.image }}'

- name: Pull public images
  containers.podman.podman_image:
    name: '{{ item }}'
  loop:
    - '{{ envoy_image }}'
    - '{{ controller_image }}'
    - '{{ eda_image }}'
    - '{{ eda_web_image }}'
    - '{{ de_image }}'
    - '{{ hub_web_image }}'
    - '{{ receptor_image }}'
    - '{{ ee_image }}'
    - '{{ postgresql_image }}'
    - '{{ redis_image }}'
    - '{{ trust_image }}'
