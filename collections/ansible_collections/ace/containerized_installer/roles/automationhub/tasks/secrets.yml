---
# settings.py carries credentials, so it travels as a podman secret
# rather than a file on disk — the bundle does exactly this.
- name: Create hub podman secrets
  containers.podman.podman_secret:
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    skip_existing: true
  loop:
    - name: hub_secret_key
      data: '{{ hub_secret_key }}'
    - name: hub_database_fields
      data: '{{ hub_database_fields_key }}'
    - name: hub_admin_password
      data: '{{ admin_password }}'
    - name: hub_settings
      data: "{{ lookup('ansible.builtin.template', 'settings.py.j2') }}"
  loop_control:
    label: '{{ item.name }}'
  no_log: true

- name: Look up the galaxy resource-server secret
  containers.podman.podman_secret_info:
    name: galaxy_resource_server
  register: _hub_rs
  failed_when: false

- name: Assert the galaxy resource-server secret exists
  ansible.builtin.assert:
    that: _hub_rs.secrets | default([]) | length > 0
    fail_msg: >-
      galaxy_resource_server secret missing — gateway postinstall must run
      before the hub role.
