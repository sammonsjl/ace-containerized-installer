---
- name: Assert supported OS and architecture
  ansible.builtin.assert:
    that:
      - ansible_distribution_major_version | int == 9
      - ansible_os_family == 'RedHat'
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      This installer targets EL9 (Rocky/Alma/RHEL 9) on aarch64 or x86_64.

- name: Assert enough memory for the full stack
  ansible.builtin.assert:
    that: ansible_memtotal_mb >= 7000
    fail_msg: 'At least 8 GB of RAM is required (found {{ ansible_memtotal_mb }} MB).'

# The Vagrant box ships these; a stock Rocky cloud image (terraform/ace)
# does not. python3-cryptography/psycopg2 back the community.crypto and
# postgresql modules on the target; python3-firewall backs ansible.posix.
# firewalld in the common role.
- name: Install required OS packages
  ansible.builtin.dnf:
    name: '{{ preflight_packages }}'
    state: present
  become: true

- name: Enable firewalld (the common role opens the envoy ports through it)
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  become: true

- name: Check podman is installed
  ansible.builtin.command: podman --version
  register: _podman_version
  changed_when: false

- name: Assert podman version
  ansible.builtin.assert:
    that: _podman_version.stdout.split()[-1] is version(podman_min_version, '>=')
    fail_msg: 'podman >= {{ podman_min_version }} required, found: {{ _podman_version.stdout }}'

# Ports are only required to be free on the FIRST install — on re-runs our
# own services legitimately hold them. The postgresql user unit is the marker.
- name: Check whether this is a re-run
  ansible.builtin.stat:
    path: '{{ ansible_user_dir }}/.config/systemd/user/postgresql.service'
  register: _installed_marker

- name: Collect listening TCP ports
  ansible.builtin.command: ss -Hltn
  register: _listening
  changed_when: false
  when: not _installed_marker.stat.exists

- name: Assert required ports are free
  when: not _installed_marker.stat.exists
  ansible.builtin.assert:
    that: >-
      _listening.stdout_lines
      | select('search', ':' ~ item ~ '\s')
      | list | length == 0
    fail_msg: 'Port {{ item }} is already in use on the target.'
  loop:
    - '{{ envoy_https_port }}'
    - '{{ envoy_http_port }}'
    - '{{ gateway_nginx_port }}'
    - '{{ controller_nginx_port }}'
    - '{{ postgresql_port }}'
    - '{{ redis_tcp_port }}'
