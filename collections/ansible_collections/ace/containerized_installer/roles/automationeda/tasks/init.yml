---
- name: Run EDA database migrations
  containers.podman.podman_container:
    name: automation-eda-init
    image: '{{ eda_image }}'
    command: aap-eda-manage migrate --noinput
    rm: true
    detach: false
    network: host
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    env: '{{ _eda_env }}'
    secrets: '{{ _eda_init_secrets }}'
    volume: '{{ _eda_common_volumes }}'
  register: _eda_migrate
  retries: 3
  delay: 20
  until: _eda_migrate is not failed
  changed_when: true

- name: Create EDA initial data
  containers.podman.podman_container:
    name: automation-eda-init
    image: '{{ eda_image }}'
    command: aap-eda-manage create_initial_data
    rm: true
    detach: false
    network: host
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    env: "{{ _eda_env | combine({'ANSIBLE_REVERSE_RESOURCE_SYNC': 'False'}) }}"
    secrets: '{{ _eda_init_secrets }}'
    volume: '{{ _eda_common_volumes }}'
  changed_when: true

- name: Create the EDA admin user
  containers.podman.podman_container:
    name: automation-eda-init
    image: '{{ eda_image }}'
    command: >-
      aap-eda-manage createsuperuser
      --username={{ admin_user }} --email={{ admin_email }} --noinput
    rm: true
    detach: false
    network: host
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    env: "{{ _eda_env | combine({'ANSIBLE_REVERSE_RESOURCE_SYNC': 'False'}) }}"
    secrets: '{{ _eda_init_secrets }}'
    volume: '{{ _eda_common_volumes }}'
  register: _eda_superuser
  failed_when:
    - _eda_superuser is failed
    - "'already taken' not in (_eda_superuser.msg | default('') ~ _eda_superuser.stderr | default(''))"
  changed_when: "'Superuser created successfully' in _eda_superuser.stdout | default('')"

- name: Set the EDA admin password
  containers.podman.podman_container:
    name: automation-eda-init
    image: '{{ eda_image }}'
    command: >-
      aap-eda-manage update_password
      --username={{ admin_user }} --password={{ admin_password }}
    rm: true
    detach: false
    network: host
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    env: '{{ _eda_env }}'
    secrets: '{{ _eda_init_secrets }}'
    volume: '{{ _eda_common_volumes }}'
  changed_when: true
  no_log: true
