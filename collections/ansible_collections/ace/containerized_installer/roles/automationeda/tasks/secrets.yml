---
- name: Create EDA podman secrets
  containers.podman.podman_secret:
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    skip_existing: true
  loop:
    - { name: eda_secret_key, data: '{{ eda_secret_key }}' }
    - { name: eda_admin_password, data: '{{ admin_password }}' }
    - { name: eda_db_password, data: '{{ eda_pg_password }}' }
  loop_control:
    label: '{{ item.name }}'
  no_log: true

- name: Look up the EDA resource-server secret
  containers.podman.podman_secret_info:
    name: eda_resource_server
  register: _eda_rs
  failed_when: false

- name: Assert the EDA resource-server secret exists
  ansible.builtin.assert:
    that: _eda_rs.secrets | default([]) | length > 0
    fail_msg: >-
      eda_resource_server secret missing — gateway postinstall must run
      before the EDA role.
